name: Build

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup xmake
      uses: xmake-io/github-action-setup-xmake@v1
      
    - name: Build
      run: xmake
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Napper
        path: build/windows/x64/release/
